name: verify

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install Linux UI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libfontconfig1-dev             libfreetype6-dev             libxkbcommon-dev             libxkbcommon-x11-dev             libwayland-dev             libx11-dev             libxcursor-dev             libxrandr-dev             libxi-dev             libgl1-mesa-dev
      - run: ./scripts/verify.sh

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
